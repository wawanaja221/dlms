<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>dlms wansPRo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#10151c;--pn:#171e28;--p2:#1f2733;--bd:#2e3a4a;
  --tx:#e8eef5;--mu:#8b98a8;--ac:#4da3ff;--acb:#173554;
  --on:#ff6b7a;--line:rgba(77,163,255,.16);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font:13px/1.4 system-ui,-apple-system,sans-serif;background:#10151c;color:var(--tx);min-height:100vh;padding-bottom:max(12px,env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--bd);border-radius:10px}
button{padding:9px 12px;min-height:40px;cursor:pointer}
button:active{transform:scale(.98)}
button.a{background:var(--acb);border-color:var(--ac);color:#cfe6ff}
button.on{background:#3a2226;border-color:var(--on);color:#ffc9cf}
button.sel{outline:2px solid var(--ac);outline-offset:1px}
input[type=number]{width:88px;text-align:center;min-height:38px;background:#121820}
.app{max-width:980px;margin:0 auto}
.top{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;background:rgba(23,30,40,.95);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.brand i{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,#4da3ff,#2a7fc8);font-style:normal;font-size:11px;color:#fff}
.brand small{display:block;font-weight:500;color:var(--mu);font-size:10px;margin-top:1px}
.top .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--bd);font-size:11px;color:var(--mu);background:var(--p2);display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:#64748b}
.chip i.ok{background:#22c55e}
.tb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:#141a22}
.nav{display:flex;gap:5px;padding:8px 10px;position:sticky;top:56px;z-index:30;background:rgba(16,21,28,.96);border-bottom:1px solid var(--line);overflow-x:auto}
.nav button{flex:1 1 0;min-width:58px;font-size:11px;font-weight:700;border-radius:11px;color:var(--mu);background:var(--p2);border-color:transparent}
.nav button.a{background:#2d6ea8;border-color:var(--ac);color:#fff}
.pad{padding:10px 10px 0}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.card h2{margin:0 0 10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);font-weight:600}
.card h2 b{color:var(--tx);letter-spacing:0;font-size:14px;text-transform:none;font-weight:700}
.strips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scroll-snap-type:x mandatory}
.ch{flex:0 0 118px;scroll-snap-align:start;background:var(--p2);border:1px solid var(--bd);border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;gap:6px}
.ch .nm{text-align:center;font-weight:800;font-size:13px}
.ch .gval{text-align:center;font:12px ui-monospace,monospace;color:#7eb6e8}
.ch .btns{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.ch .btns button{padding:7px 2px;font-size:10px;font-weight:700;min-height:34px}
.ch .btns button.wide{grid-column:1/-1}
.ch .mutebtn{width:100%;font-weight:800;letter-spacing:.06em}
.ch .mutebtn.on{background:#3a2226;border-color:var(--on);color:#ffc9cf}
.mx{border-collapse:separate;border-spacing:5px;margin:0 auto}
.mx th{font-size:10px;color:var(--mu);font-weight:700}
.dot{width:30px;height:30px;padding:0;border-radius:9px;background:#141b25}
.dot:after{content:"";display:block;width:8px;height:8px;margin:auto;border-radius:50%;background:#3a4658}
.dot.on{background:#153552;border-color:var(--ac)}
.dot.on:after{background:#5eb0ff}
.field{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #273140}
.field .l{font-weight:600;color:#c5d0dc;min-width:70px}
.nw{display:flex;align-items:center;gap:4px}
.nw button{width:36px;min-width:36px;height:36px;padding:0;font-size:18px;font-weight:700}
#cv{width:100%;height:200px;display:block;background:#0e131a;border-radius:12px;border:1px solid var(--bd);touch-action:none}
.eqb{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-top:8px}
.eqb button{padding:8px 1px;font-size:10px;font-weight:700}
.eqb button.active{background:#1a3d66;border-color:#f0c14d;color:#fff}
.vrow{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center;margin-bottom:5px}
.vlab{font-size:10px;font-weight:700;text-align:right;color:#94a3b8}
.vlab.lim{color:#f87171}
.vtr{height:16px;border-radius:999px;background:#121821;border:1px solid #2a3545;display:flex;gap:2px;padding:3px;overflow:hidden}
.vrow.lim .vtr{height:11px;background:#1a1416;border-color:#3d2a2e}
.vu-seg{flex:1;min-width:0;border-radius:2px;background:#2a3442;opacity:.28}
.vu-seg.on.g{background:#3dd68c;opacity:1}
.vu-seg.on.y{background:#f0c14d;opacity:1}
.vu-seg.on.r{background:#ff6b7a;opacity:1}
.vscale{display:flex;justify-content:space-between;padding:2px 0 8px 56px;font:9px ui-monospace,monospace;color:#64748b}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:#334155;margin-left:3px;vertical-align:middle}
.led.on{background:#ff6b7a}
.locked-ui{opacity:.55;pointer-events:none}
@media(max-width:899px){.tab-pane{display:none}.tab-pane.on{display:block}}
@media(min-width:900px){.nav{display:none}.tab-pane{display:block!important}.strips{flex-wrap:wrap;overflow:visible}.ch{flex:1 1 120px;max-width:140px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><i>DLS</i><div>dlms wansPRo<small>4 IN · 8 OUT · LIVE</small></div></div>
    <div class="r">
      <span class="chip"><i id="dot"></i><span id="st">Konek…</span></span>
      <button class="a" id="bs">Save</button><button id="lk">Lock</button>
    </div>
  </div>
  <div class="tb">
    <button class="a" id="ua">Unmute</button>
    <button id="ma">Mute All</button>
  </div>
  <nav class="nav" id="navMain">
    <button type="button" class="a" data-tab="in">INPUT</button>
    <button type="button" data-tab="route">ROUTE</button>
    <button type="button" data-tab="out">OUTPUT</button>
    <button type="button" data-tab="param">PARAM</button>
    <button type="button" data-tab="vu">VU</button>
  </nav>
  <div class="pad">
    <div class="card tab-pane on" data-pane="in"><h2><b>Input</b></h2><div class="strips" id="I"></div></div>
    <div class="card tab-pane" data-pane="route"><h2><b>Routing</b></h2><div style="overflow-x:auto"><table class="mx" id="X"></table></div></div>
    <div class="card tab-pane" data-pane="out"><h2><b>Output</b></h2><div class="strips" id="O"></div></div>
    <div class="card tab-pane" data-pane="param" id="P"><h2><b>Parameter</b></h2><div style="color:var(--mu)">Pilih GAIN / EQ / COMP / XOVER / LIM / DLY</div></div>
    <div class="card tab-pane" data-pane="vu"><h2><b>VU</b></h2><div id="MI"></div><div id="MO"></div></div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const EQN=8;
const BC=['#ff6b7a','#f0c14d','#3dd68c','#4da3ff','#c084fc','#fb923c','#2dd4bf','#e879f9'];
const EQF=[63,125,250,500,1000,2000,4000,8000];
function mkEq(){return EQF.map(f=>({enabled:false,freq:f,gain:0,q:1.2,type:0}));}
function mkComp(){return {enabled:false,threshold:-12,ratio:4,attack:10,release:100,makeup:0};}
function mkIn(){return {mute:false,polarity:false,gain:0,delay:0,comp:mkComp(),eq:mkEq()};}
function mkOut(){return {mute:false,polarity:false,gain:0,delay:0,comp:mkComp(),eq:mkEq(),
  hpf:{enabled:false,freq:40,slope:24},lpf:{enabled:false,freq:16000,slope:24},
  limiter:{enabled:true,threshold:-3,attack:5,release:100}};}

let S={preset:'Default',inputs:[0,1,2,3].map(mkIn),outputs:[0,1,2,3,4,5,6,7].map(mkOut),routes:Array.from({length:4},()=>Array(8).fill(true))};
let sel=null, band=0, drag=null, ws=null, fr=0, hostNow='', locked=false;
const mIn=Array(4).fill(-90), mOut=Array(8).fill(-90), mGr=Array(8).fill(0);
const vuSmooth={}, elc={};
const VU_LEDS=[{db:-60,c:'g'},{db:-40,c:'g'},{db:-28,c:'g'},{db:-20,c:'g'},{db:-16,c:'g'},{db:-12,c:'g'},{db:-8,c:'g'},{db:-4,c:'g'},{db:-2,c:'y'},{db:0,c:'y'},{db:2,c:'y'},{db:4,c:'r'},{db:6,c:'r'},{db:8,c:'r'}];
const VU_LABELS=['-60','-40','-28','-20','-16','-12','-8','-4','-2','0','+2','+4','+6','+8'];

const st=(s,ok)=>{ $('#st').textContent=s; $('#dot').className=ok?'ok':''; };
const el=id=>elc[id]||(elc[id]=document.getElementById(id));
function send(o){try{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));}catch(_){}}
function requestState(){send({type:'get_state'});}
function applyLockUI(){
  const pad=document.querySelector('.pad'); if(pad) pad.classList.toggle('locked-ui', locked);
  const lk=document.getElementById('lk'); if(lk){ lk.textContent=locked?'Unlock':'Lock'; lk.classList.toggle('on', locked); }
}

function setParam(section,channel,param,value){
  if(locked){ st('LOCKED'); return; }
  if(param.endsWith('.type')||param.endsWith('.enabled')){
    // ensure int/bool friendly for firmware
  }
  if(typeof value==='string' && value!=='' && !isNaN(+value) && (param.includes('.type')||param.includes('.freq')||param.includes('.gain')||param.includes('.q')||param.includes('threshold')||param.includes('ratio')||param.includes('attack')||param.includes('release')||param.includes('makeup')||param.includes('slope')||param==='gain'||param==='delay'))
    value=+value;
  send({type:'set',section,channel,param,value});
  const idx=channel-1;
  const ch=section==='input'?S.inputs[idx]:S.outputs[idx];
  if(!ch) return;
  if(param==='mute') ch.mute=!!value;
  else if(param==='polarity') ch.polarity=!!value;
  else if(param==='gain') ch.gain=+value;
  else if(param==='delay') ch.delay=+value;
  else if(param.startsWith('eq.')){
    const p=param.split('.'); const bi=+p[1], k=p[2];
    if(!ch.eq[bi]) ch.eq[bi]={enabled:false,freq:EQF[bi]||1000,gain:0,q:1.2};
    if(k==='enabled') ch.eq[bi].enabled=!!value;
    if(k==='freq') ch.eq[bi].freq=+value;
    if(k==='gain') ch.eq[bi].gain=+value;
    if(k==='q') ch.eq[bi].q=+value;
    if(k==='type') ch.eq[bi].type=+value;
  } else if(param.startsWith('comp.')||param.startsWith('hpf.')||param.startsWith('lpf.')||param.startsWith('limiter.')){
    const [g,k]=param.split('.');
    if(!ch[g]) ch[g]={};
    ch[g][k]=value;
  }
  draw();
}

function mapComp(s){
  if(!s) return mkComp();
  return {
    enabled:!!s.enabled,
    threshold:+(s.threshold??-12),
    ratio:+(s.ratio??4),
    attack:+(s.attack??10),
    release:+(s.release??100),
    makeup:+(s.makeup??0)
  };
}
function mapEq(arr){
  const base=mkEq();
  if(!Array.isArray(arr)) return base;
  return base.map((b,i)=>{
    const s=arr[i]||{};
    return {enabled:!!s.enabled, freq:+(s.freq||b.freq), gain:+(s.gain||0), q:+(s.q||1.2), type:+(s.type||0)};
  });
}
function mapState(src){
  if(!src) return;
  S.preset=src.preset||S.preset;
  (src.inputs||[]).forEach((s,i)=>{
    if(!S.inputs[i]) S.inputs[i]=mkIn();
    Object.assign(S.inputs[i],{mute:!!s.mute,polarity:!!s.polarity,gain:+s.gain||0,delay:+s.delay||0});
    S.inputs[i].comp=mapComp(s.comp);
    S.inputs[i].eq=mapEq(s.eq);
  });
  (src.outputs||[]).forEach((s,i)=>{
    if(!S.outputs[i]) S.outputs[i]=mkOut();
    Object.assign(S.outputs[i],{mute:!!s.mute,polarity:!!s.polarity,gain:+s.gain||0,delay:+s.delay||0});
    S.outputs[i].comp=mapComp(s.comp);
    if(s.hpf) S.outputs[i].hpf=s.hpf;
    if(s.lpf) S.outputs[i].lpf=s.lpf;
    if(s.limiter) S.outputs[i].limiter=s.limiter;
    S.outputs[i].eq=mapEq(s.eq);
  });
  if(src.routes) S.routes=src.routes;
}

function conn(host){
  hostNow=host;
  try{if(ws){ws.onclose=null;ws.onerror=null;ws.close();}}catch(_){}
  st('Konek…');
  try{
    ws=new WebSocket('ws://'+host+':81/');
    ws.onopen=()=>{st('ONLINE',1); requestState();};
    ws.onclose=()=>{st('Reconnect…'); setTimeout(()=>conn(hostNow),1200);};
    ws.onerror=()=>{st('WS error');};
    ws.onmessage=e=>{
      try{
        const m=JSON.parse(e.data);
        if(m.type==='state'&&m.state){mapState(m.state);draw();if(sel)panel();}
        else if(m.type==='meters') applyMeters(m);
        else if(m.type==='set'){
          const idx=(m.channel|0)-1, p=m.param||'', v=m.value;
          const ch=m.section==='input'?S.inputs[idx]:S.outputs[idx];
          if(!ch) return;
          if(p==='mute') ch.mute=!!v;
          if(p==='gain') ch.gain=+v;
          if(p==='polarity') ch.polarity=!!v;
          if(p==='delay') ch.delay=+v;
          draw(); if(sel) panel();
        }
      }catch(_){}
    };
  }catch(_){st('Gagal'); setTimeout(()=>conn(hostNow),2000);}
}

function draw(){
  $('#I').innerHTML=S.inputs.map((c,i)=>`<div class="ch">
    <div class="nm">IN ${i+1}</div>
    <div class="gval">${(+c.gain||0).toFixed(1)} dB</div>
    <button class="mutebtn ${c.mute?'on':''}" data-k="i" data-i="${i}" data-p="mute">MUTE</button>
    <div class="btns">
      <button class="${sel&&sel.k==='i'&&sel.i===i&&sel.p==='gain'?'sel':''}" data-k="i" data-i="${i}" data-p="gain">GAIN</button>
      <button class="${sel&&sel.k==='i'&&sel.i===i&&sel.p==='eq'?'sel':''}" data-k="i" data-i="${i}" data-p="eq">EQ</button>
      <button class="${sel&&sel.k==='i'&&sel.i===i&&sel.p==='comp'?'sel':''}" data-k="i" data-i="${i}" data-p="comp">COMP<span class="led" id="LCI${i}"></span></button>
      <button class="${sel&&sel.k==='i'&&sel.i===i&&sel.p==='dly'?'sel':''}" data-k="i" data-i="${i}" data-p="dly">DLY</button>
      <button class="wide ${c.polarity?'on':''}" data-k="i" data-i="${i}" data-p="pol">Ø PHASE</button>
    </div>
  </div>`).join('');
  $('#O').innerHTML=S.outputs.map((c,o)=>`<div class="ch">
    <div class="nm">OUT ${o+1}</div>
    <div class="gval">${(+c.gain||0).toFixed(1)} dB</div>
    <button class="mutebtn ${c.mute?'on':''}" data-k="o" data-i="${o}" data-p="mute">MUTE</button>
    <div class="btns">
      <button class="${sel&&sel.k==='o'&&sel.i===o&&sel.p==='gain'?'sel':''}" data-k="o" data-i="${o}" data-p="gain">GAIN</button>
      <button class="${sel&&sel.k==='o'&&sel.i===o&&sel.p==='eq'?'sel':''}" data-k="o" data-i="${o}" data-p="eq">EQ</button>
      <button class="${sel&&sel.k==='o'&&sel.i===o&&sel.p==='xo'?'sel':''}" data-k="o" data-i="${o}" data-p="xo">XOVER</button>
      <button class="${sel&&sel.k==='o'&&sel.i===o&&sel.p==='comp'?'sel':''}" data-k="o" data-i="${o}" data-p="comp">COMP<span class="led" id="LCO${o}"></span></button>
      <button class="${sel&&sel.k==='o'&&sel.i===o&&sel.p==='lim'?'sel':''}" data-k="o" data-i="${o}" data-p="lim">LIM</button>
      <button class="${sel&&sel.k==='o'&&sel.i===o&&sel.p==='dly'?'sel':''}" data-k="o" data-i="${o}" data-p="dly">DLY</button>
    </div>
  </div>`).join('');
  let h='<tr><th></th>'; for(let n=1;n<=8;n++) h+=`<th>OUT ${n}</th>`; h+='</tr>';
  for(let i=0;i<4;i++){h+=`<tr><th>IN ${i+1}</th>`;
    for(let j=0;j<8;j++) h+=`<td><button class="dot ${S.routes[i][j]?'on':''}" data-m="${i},${j}"></button></td>`;
    h+='</tr>';}
  $('#X').innerHTML=h;
}

function getLocal(path){let c=S; for(const p of path.split('.')){ if(c==null)return 0; c=c[p]; } return c; }
function num(lab,path,mn,mx,st,u){
  const v=getLocal(path);
  return `<div class="field"><span class="l">${lab}</span><div class="nw">
    <button type="button" data-step="-1" data-path="${path}">−</button>
    <input type="number" data-p="${path}" min="${mn}" max="${mx}" step="${st}" value="${v??0}">
    <span style="color:var(--mu)">${u||''}</span>
    <button type="button" data-step="1" data-path="${path}">+</button></div></div>`;
}
function chk(lab,path){return `<label class="field"><span class="l">${lab}</span><input type="checkbox" data-p="${path}" ${getLocal(path)?'checked':''}></label>`;}

function panel(){
  if(!sel||sel.p==='mute'||sel.p==='pol') return;
  const {k,i,p}=sel; const ch=k==='i'?S.inputs[i]:S.outputs[i];
  const base=k==='i'?`inputs.${i}`:`outputs.${i}`;
  let h=`<h2><b>${k==='i'?'IN':'OUT'} ${i+1}</b> · ${p.toUpperCase()}</h2>`;
  if(p==='gain'){ h+=num('Gain',base+'.gain',-18,18,.1,'dB'); h+=chk('Phase 180°',base+'.polarity'); }
  if(p==='dly') h+=num('Delay',base+'.delay',0,1000,.1,'ms');
  if(p==='comp'){
    h+=`<div class="field"><span class="l">Status</span><span><span class="led" id="LCP" style="width:12px;height:12px"></span> <span id="CGR" style="font:12px ui-monospace,monospace;color:#ff6b7a">0.0 dB</span></span></div>`;
    h+=num('Threshold',base+'.comp.threshold',-40,0,.5,'dB');
    h+=num('Ratio',base+'.comp.ratio',1,20,.1,':1');
    h+=num('Attack',base+'.comp.attack',.1,100,.1,'ms');
    h+=num('Release',base+'.comp.release',10,1000,5,'ms');
    h+=num('Makeup',base+'.comp.makeup',-12,12,.1,'dB');
    h+=chk('Enabled',base+'.comp.enabled');
  }
  if(p==='lim'&&k==='o'){
    h+=num('Threshold',base+'.limiter.threshold',-20,0,.5,'dB');
    h+=num('Attack',base+'.limiter.attack',.1,50,.1,'ms');
    h+=num('Release',base+'.limiter.release',10,500,5,'ms');
    h+=chk('Enabled',base+'.limiter.enabled');
  }
  if(p==='xo'&&k==='o'){
    h+=`<div style="font-weight:700;margin:4px 0">HPF</div>`;
    h+=num('Freq',base+'.hpf.freq',20,10000,1,'Hz');
    h+=num('Slope',base+'.hpf.slope',12,48,12,'dB/oct');
    h+=chk('Enabled',base+'.hpf.enabled');
    h+=`<div style="font-weight:700;margin:10px 0 4px">LPF</div>`;
    h+=num('Freq',base+'.lpf.freq',50,20000,1,'Hz');
    h+=num('Slope',base+'.lpf.slope',12,48,12,'dB/oct');
    h+=chk('Enabled',base+'.lpf.enabled');
  }
  if(p==='eq'){
    h+=`<canvas id="cv"></canvas><div class="eqb" id="EQB"></div><div id="BR"></div>
    <div style="color:var(--mu);font-size:10px;margin-top:6px">Drag = freq/gain · scroll/cubit = lebar band (Q)</div>`;
  }
  $('#P').innerHTML=h;
  if(p==='eq'){ bandRow(); bindCv(); drawEq(); }
}

function bandRow(){
  const ch=sel.k==='i'?S.inputs[sel.i]:S.outputs[sel.i];
  if(!ch.eq||ch.eq.length<EQN) ch.eq=mkEq();
  const base=(sel.k==='i'?'inputs.':'outputs.')+sel.i+'.eq.'+band;
  const tName=['P','LS','HS','LC','HC'];
  $('#EQB').innerHTML=ch.eq.map((b,n)=>`<button class="${n===band?'active':''}" data-band="${n}" style="border-bottom:3px solid ${BC[n%BC.length]}">${n+1}<small style="display:block;font-size:8px;opacity:.8">${tName[b.type|0]||'P'}</small></button>`).join('');
  const e=ch.eq[band];
  const ty=+(e.type||0);
  $('#BR').innerHTML=`
    <div class="field"><span class="l">Type</span>
      <select data-p="${base}.type">
        <option value="0"${ty===0?' selected':''}>Peaking</option>
        <option value="1"${ty===1?' selected':''}>Low-Shelf</option>
        <option value="2"${ty===2?' selected':''}>High-Shelf</option>
        <option value="3"${ty===3?' selected':''}>Low-Cut</option>
        <option value="4"${ty===4?' selected':''}>High-Cut</option>
      </select>
    </div>
    ${num('Freq',base+'.freq',20,20000,1,'Hz')}
    ${num('Gain',base+'.gain',-15,15,.1,'dB')}
    ${num('Q',base+'.q',.3,10,.1,'')}
    ${chk('On',base+'.enabled')}`;
}

function drawEq(){
  const cv=$('#cv'); if(!cv||!sel||sel.p!=='eq') return;
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth||320, h=200;
  if(cv.width!==((w*dpr)|0)||cv.height!==((h*dpr)|0)){cv.width=(w*dpr)|0;cv.height=(h*dpr)|0;}
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const ch=sel.k==='i'?S.inputs[sel.i]:S.outputs[sel.i];
  const PL=30,PR=8,PT=10,PB=18,LMIN=Math.log10(20),SPAN=3,DR=15;
  const X=f=>PL+(Math.log10(cl(f,20,20000))-LMIN)/SPAN*(w-PL-PR);
  const Y=db=>PT+(h-PT-PB)*(0.5-db/(2*DR));
  g.fillStyle='#0e131a'; g.fillRect(0,0,w,h);
  g.strokeStyle='#1f2a38'; g.fillStyle='#7d8b9a'; g.font='10px system-ui';
  for(let db=-DR;db<=DR;db+=5){
    const y=Y(db)|0; g.beginPath(); g.moveTo(PL,y); g.lineTo(w-PR,y); g.stroke();
    g.textAlign='right'; g.fillText((db>0?'+':'')+db,PL-4,y+3);
  }
  [20,50,100,200,500,1000,2000,5000,10000,20000].forEach(f=>{
    const x=X(f)|0; g.beginPath(); g.moveTo(x,PT); g.lineTo(x,h-PB); g.stroke();
    g.textAlign='center'; g.fillText(f>=1000?(f/1000)+'k':f,x,h-4);
  });
  const resp=(f,b)=>{
    if(!b||!b.enabled) return 0;
    const fc=Math.max(20,b.freq||1000), q=Math.max(0.3,b.q||1.2), g0=b.gain||0;
    const t=+(b.type||0);
    const r=f/fc;
    if(t===3){ // low-cut ~12/24dB-ish visual
      const n=q>=1.5?2:1; return -6*n*Math.log2(1+1/(r*r+1e-9));
    }
    if(t===4){ // high-cut
      const n=q>=1.5?2:1; return -6*n*Math.log2(1+r*r);
    }
    if(t===1){ // low shelf
      const s=1/(1+Math.pow(r,2)); return g0*s;
    }
    if(t===2){ // high shelf
      const s=1/(1+1/(r*r+1e-9)); return g0*s;
    }
    // peaking
    const x=Math.log(r); return g0/(1+(x*x)*(q*q*4));
  };
  const NP=140; g.beginPath();
  for(let i=0;i<NP;i++){
    const f=Math.pow(10,LMIN+SPAN*i/(NP-1));
    let tot=0;
    ch.eq.forEach(b=>{ tot+=resp(f,b); });
    const x=X(f), y=Y(cl(tot,-DR,DR));
    i?g.lineTo(x,y):g.moveTo(x,y);
  }
  g.strokeStyle='#e8eef5'; g.lineWidth=2; g.stroke();
  ch.eq.forEach((b,i)=>{
    const x=X(b.freq||EQF[i]), y=Y(b.enabled?b.gain:0);
    g.beginPath(); g.arc(x,y,i===band?10:7,0,6.3);
    g.fillStyle=BC[i%BC.length]; g.fill();
    g.strokeStyle=i===band?'#fff':'#0a0c10'; g.lineWidth=i===band?2:1; g.stroke();
    g.fillStyle='#0a0c10'; g.font='bold 9px system-ui'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(String(i+1),x,y);
  });
}

function bindCv(){
  const cv=$('#cv'); if(!cv) return;
  let pinch0=0,q0=1;
  const pinchDist=e=>{
    if(!e.touches||e.touches.length<2) return 0;
    const a=e.touches[0],b=e.touches[1];
    return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  };
  const metrics=()=>{
    const r=cv.getBoundingClientRect();
    const w=r.width,h=r.height,PL=30,PR=8,PT=10,PB=18,DR=15,LMIN=Math.log10(20),SPAN=3;
    return {
      r,w,h,PL,PR,PT,PB,DR,LMIN,SPAN,
      X:f=>PL+(Math.log10(cl(f,20,20000))-LMIN)/SPAN*(w-PL-PR),
      Y:db=>PT+(h-PT-PB)*(0.5-db/(2*DR)),
      FX:x=>Math.pow(10,LMIN+cl((x-PL)/(w-PL-PR),0,1)*SPAN),
      GY:y=>(0.5-(y-PT)/(h-PT-PB))*2*DR
    };
  };
  cv.onpointerdown=e=>{
    if(locked){ st('LOCKED'); return; }
    const m=metrics(); const x=e.clientX-m.r.left,y=e.clientY-m.r.top;
    const ch=sel.k==='i'?S.inputs[sel.i]:S.outputs[sel.i];
    let best=null,bd=22;
    ch.eq.forEach((b,i)=>{const d=Math.hypot(m.X(b.freq)-x,m.Y(b.enabled?b.gain:0)-y); if(d<bd){bd=d;best=i;}});
    if(best==null) return;
    drag=best; band=best; bandRow(); drawEq();
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
  };
  cv.onpointermove=e=>{
    if(drag==null) return;
    const m=metrics(); const x=e.clientX-m.r.left,y=e.clientY-m.r.top;
    const ch=sel.k==='i'?S.inputs[sel.i]:S.outputs[sel.i];
    const b=ch.eq[drag];
    b.freq=cl(m.FX(x),20,20000);
    b.gain=cl(Math.round(m.GY(y)*10)/10,-15,15);
    b.enabled=true;
    const sec=sel.k==='i'?'input':'output';
    setParam(sec,sel.i+1,`eq.${drag}.freq`,b.freq);
    setParam(sec,sel.i+1,`eq.${drag}.gain`,b.gain);
    setParam(sec,sel.i+1,`eq.${drag}.enabled`,true);
    drawEq();
  };
  cv.onpointerup=()=>{drag=null;};
  cv.ontouchstart=e=>{
    if(e.touches&&e.touches.length===2){
      pinch0=pinchDist(e);
      const ch=sel.k==='i'?S.inputs[sel.i]:S.outputs[sel.i];
      q0=ch.eq[band].q||1.2; drag=null; e.preventDefault();
    }
  };
  cv.ontouchmove=e=>{
    if(e.touches&&e.touches.length===2&&pinch0>20){
      const scale=pinchDist(e)/pinch0;
      const ch=sel.k==='i'?S.inputs[sel.i]:S.outputs[sel.i];
      const q=cl(Math.round((q0/scale)*100)/100,.3,10);
      ch.eq[band].q=q; ch.eq[band].enabled=true;
      setParam(sel.k==='i'?'input':'output',sel.i+1,`eq.${band}.q`,q);
      setParam(sel.k==='i'?'input':'output',sel.i+1,`eq.${band}.enabled`,true);
      bandRow(); drawEq(); e.preventDefault();
    }
  };
  cv.onwheel=e=>{
    e.preventDefault();
    const ch=sel.k==='i'?S.inputs[sel.i]:S.outputs[sel.i];
    const b=ch.eq[band];
    b.q=cl(Math.round(b.q*(e.deltaY<0?0.9:1.1)*100)/100,.3,10);
    b.enabled=true;
    setParam(sel.k==='i'?'input':'output',sel.i+1,`eq.${band}.q`,b.q);
    bandRow(); drawEq();
  };
}

function setLed(id,db){
  const root=el(id); if(!root) return;
  let cur=vuSmooth[id]; if(cur===undefined) cur=-90;
  cur=db>cur?cur+(db-cur)*.5:cur+(db-cur)*.14;
  vuSmooth[id]=cur;
  const segs=root.children;
  for(let i=0;i<segs.length;i++){
    if(cur>=(VU_LEDS[i]?VU_LEDS[i].db:-60)-.2) segs[i].classList.add('on');
    else segs[i].classList.remove('on');
  }
}
function mkLed(id,lim){
  return `<div class="vtr" id="${id}">${VU_LEDS.map(s=>`<div class="vu-seg ${lim?'r':s.c}"></div>`).join('')}</div>`;
}
function mkScale(){return `<div class="vscale">${VU_LABELS.map(t=>`<span>${t}</span>`).join('')}</div>`;}

$('#MI').innerHTML='<div style="font-size:10px;color:var(--mu);margin-bottom:6px">INPUT</div>'+[0,1,2,3].map(i=>`<div class="vrow"><span class="vlab">IN ${i+1}</span>${mkLed('VI'+i,false)}</div>`).join('')+mkScale();
$('#MO').innerHTML='<div style="font-size:10px;color:var(--mu);margin:10px 0 6px">OUTPUT</div>'+[0,1,2,3,4,5,6,7].map(o=>`<div class="vrow"><span class="vlab">OUT ${o+1}</span>${mkLed('VO'+o,false)}</div>`).join('')+mkScale()
  +'<div style="font-size:10px;color:#f87171;margin:10px 0 6px">LIMITER</div>'+[0,1,2,3,4,5,6,7].map(o=>`<div class="vrow lim"><span class="vlab lim">L ${o+1}</span>${mkLed('VL'+o,true)}</div>`).join('');

const cInGr=Array(4).fill(0), cOutGr=Array(8).fill(0);
function applyMeters(m){
  (m.input||[]).forEach((db,i)=>{mIn[i]=+db; setLed('VI'+i,mIn[i]);});
  (m.output||[]).forEach((db,o)=>{
    mOut[o]=+db; setLed('VO'+o,mOut[o]);
    const gr=((m.limiterGR||m.gr||[])[o])||0;
    mGr[o]=+gr; setLed('VL'+o, -60+(cl(mGr[o],0,12)/12)*68);
  });
  (m.compIn||[]).forEach((g,i)=>{cInGr[i]=+g||0; const el=document.getElementById('LCI'+i); if(el) el.classList.toggle('on', cInGr[i]>0.4);});
  (m.compOut||[]).forEach((g,o)=>{cOutGr[o]=+g||0; const el=document.getElementById('LCO'+o); if(el) el.classList.toggle('on', cOutGr[o]>0.4);});
  if(sel&&sel.p==='comp'){
    const gr=sel.k==='i'?(cInGr[sel.i]||0):(cOutGr[sel.i]||0);
    const pan=document.getElementById('LCP'); if(pan) pan.classList.toggle('on', gr>0.4);
    const gt=document.getElementById('CGR'); if(gt) gt.textContent=gr>0.05?('−'+gr.toFixed(1)+' dB'):'0.0 dB';
  }
}

document.addEventListener('click',e=>{
  if(locked && e.target.id!=='lk' && !e.target.closest('#navMain') && !e.target.closest('#bs') && !e.target.closest('#ua') && !e.target.closest('#ma')){
    if(e.target.closest('[data-k]')||e.target.closest('[data-m]')||e.target.closest('#P')||e.target.closest('[data-band]')){
      st('LOCKED'); return;
    }
  }
  const m=e.target.dataset.m;
  if(m!=null){
    const [i,j]=m.split(',').map(Number);
    const en=!S.routes[i][j];
    S.routes[i][j]=en;
    send({type:'route',input:i+1,output:j+1,enabled:en});
    draw(); return;
  }
  if(e.target.dataset.band!=null){band=+e.target.dataset.band;bandRow();drawEq();return;}
  const t=e.target.closest('[data-k]'); if(!t) return;
  const k=t.dataset.k,i=+t.dataset.i,p=t.dataset.p;
  const sec=k==='i'?'input':'output';
  const ch=k==='i'?S.inputs[i]:S.outputs[i];
  if(p==='mute'){setParam(sec,i+1,'mute',!ch.mute);return;}
  if(p==='pol'){setParam(sec,i+1,'polarity',!ch.polarity);return;}
  sel={k,i,p}; panel(); draw();
  if(window.matchMedia('(max-width:899px)').matches) showTab('param');
});

$('#P').addEventListener('change',e=>{
  if(locked){ st('LOCKED'); return; }
  const t=e.target; if(t.tagName!=='SELECT'||!t.dataset.p||!sel) return;
  const path=t.dataset.p;
  const parts=path.split('.');
  if(parts.length<5) return;
  const sec=parts[0]==='inputs'?'input':'output';
  const chIdx=+parts[1];
  const bi=+parts[3];
  const v=parseInt(t.value,10);
  const ty=Number.isFinite(v)?v:0;
  const chObj=sec==='input'?S.inputs[chIdx]:S.outputs[chIdx];
  if(chObj&&chObj.eq&&chObj.eq[bi]){
    chObj.eq[bi].type=ty;
    chObj.eq[bi].enabled=true;
  }
  setParam(sec, chIdx+1, 'eq.'+bi+'.type', ty);
  setParam(sec, chIdx+1, 'eq.'+bi+'.enabled', true);
  bandRow();
  drawEq();
});
$('#P').addEventListener('input',e=>{
  if(locked){ st('LOCKED'); return; }
  const t=e.target, path=t.dataset.p; if(!path||!sel) return;
  if(t.tagName==='SELECT') return;
  let v=t.type==='checkbox'?t.checked:parseFloat(t.value);
  if(typeof v==='number'&&t.min!=='') v=cl(v,+t.min,+t.max);
  const parts=path.split('.');
  const sec=parts[0]==='inputs'?'input':'output';
  const ch=+parts[1]+1;
  let param;
  if(parts.length===3) param=parts[2];
  else if(parts.length===4) param=parts[2]+'.'+parts[3];
  else if(parts.length===5) param=parts[2]+'.'+parts[3]+'.'+parts[4];
  else return;
  setParam(sec,ch,param,v);
  if(sel.p==='eq') drawEq();
});
$('#P').addEventListener('click',e=>{
  const b=e.target.closest('[data-step]'); if(!b) return;
  const input=$('#P').querySelector(`input[data-p="${b.dataset.path}"]`); if(!input) return;
  const st=+input.step||1;
  const n=cl((+input.value||0)+(+b.dataset.step)*st,+input.min,+input.max);
  input.value=n; input.dispatchEvent(new Event('input',{bubbles:true}));
});

function showTab(name){
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.toggle('on',p.dataset.pane===name));
  document.querySelectorAll('#navMain [data-tab]').forEach(b=>b.classList.toggle('a',b.dataset.tab===name));
}
$('#navMain').addEventListener('click',e=>{
  const b=e.target.closest('[data-tab]'); if(!b) return; showTab(b.dataset.tab);
});

$('#bs').onclick=()=>{ if(ws&&ws.readyState===1){send({type:'save',name:S.preset||'Default'});st('TERSIMPAN',1);} else st('OFFLINE'); };
$('#ma').onclick=()=>{ if(locked){ st('LOCKED'); return; } S.outputs.forEach((_,j)=>setParam('output',j+1,'mute',true)); };
$('#ua').onclick=()=>{ if(locked){ st('LOCKED'); return; } S.outputs.forEach((_,j)=>setParam('output',j+1,'mute',false)); };
$('#lk').onclick=()=>{
  locked=!locked;
  try{ if(locked) localStorage.setItem('dlms_lock','1'); else localStorage.removeItem('dlms_lock'); }catch(_){}
  applyLockUI();
  st(locked?'LOCKED':'UNLOCK', !locked);
};
try{ locked=!!localStorage.getItem('dlms_lock'); }catch(_){}
applyLockUI();

function tick(){
  fr++;
  if(sel&&sel.p==='eq'&&(fr%2)===0) drawEq();
  requestAnimationFrame(tick);
}

draw();
tick();
// Auto connect: host dari URL, fallback AP ESP32
const host=location.hostname && location.hostname!=='localhost' && location.hostname!=='127.0.0.1'
  ? location.hostname : '192.168.4.1';
conn(host);
</script>
