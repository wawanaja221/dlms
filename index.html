<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>dlms wansPRo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
:root{
  --bg:#0e1218; --pn:#161c24; --p2:#1c2430; --bd:#2c3645;
  --tx:#e6ebf2; --mu:#9aa6b5; --ac:#5b9fd4; --acb:#1a3348;
  --on:#e87979; --gn:#4ade80; --yl:#f0c14a;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font:12.5px/1.35 system-ui,-apple-system,sans-serif;
  background:radial-gradient(1000px 520px at 50% -8%,#1a2535 0%,var(--bg) 50%);
  color:var(--tx); min-height:100vh;
  padding-bottom:max(12px, env(safe-area-inset-bottom));
}
button,input,select{
  font:inherit;color:var(--tx);background:var(--p2);
  border:1px solid var(--bd);border-radius:8px;
}
button{padding:8px 10px;min-height:36px;cursor:pointer}
button:active{transform:scale(.98)}
button.a{background:var(--acb);border-color:var(--ac);color:#93c5fd}
button.on{background:#3f1212;border-color:var(--on);color:#fca5a5}
button.sel{outline:2px solid var(--ac);outline-offset:1px}
input[type=number]{width:84px;text-align:center;min-height:36px;background:#0f1318}
input[type=file]{display:none}
input[type=range]{width:100px;accent-color:var(--ac)}
select{min-height:36px;padding:6px 8px;background:#0f1318}

.app{max-width:980px;margin:0 auto;padding:0 0 16px}

/* top bar */
.top{
  position:sticky;top:0;z-index:40;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:10px 12px;background:rgba(11,13,16,.92);
  border-bottom:1px solid var(--bd);backdrop-filter:blur(10px);
}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.04em}
.brand i{
  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(135deg,#5b9fd4,#3d8f9e);font-style:normal;font-size:12px;
}
.brand small{display:block;font-weight:500;color:var(--mu);font-size:10px;letter-spacing:0}
.top .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{
  padding:4px 10px;border-radius:999px;border:1px solid var(--bd);
  font-size:10px;color:var(--mu);background:var(--p2);
}
.chip.ok{color:#86efac;border-color:#166534;background:#052e16}

/* player */
.player{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding:8px 12px;border-bottom:1px solid var(--bd);background:#0f1318;
}
.player .info{font-size:11px;color:var(--mu);min-width:0;flex:1 1 120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* sticky section tabs */
.nav{
  display:flex;gap:4px;padding:8px 10px;position:sticky;top:52px;z-index:30;
  background:rgba(11,13,16,.9);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--bd);overflow-x:auto;
}
.nav button{
  flex:1 1 0;min-width:64px;padding:9px 6px;font-size:11px;font-weight:700;
  border-radius:10px;background:#12161c;
}
.nav button.a{background:linear-gradient(180deg,#2d6a9f,#1e4f78);border-color:#5b9fd4;color:#fff}

.pad{padding:10px 10px 0}
.card{
  background:var(--pn);border:1px solid var(--bd);border-radius:12px;
  padding:12px;margin-bottom:10px;
  box-shadow:0 4px 16px rgba(0,0,0,.18);
}
.card h2{
  margin:0 0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);
  display:flex;justify-content:space-between;align-items:center;
}
.card h2 b{color:var(--tx);letter-spacing:0;font-size:13px;text-transform:none}

/* channel strip cards */
.strips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.ch{
  flex:0 0 108px;scroll-snap-align:start;
  background:linear-gradient(180deg,#1e2630 0%,#1a212c 100%);
  border:1px solid var(--bd);border-radius:12px;
  padding:8px 6px 6px;display:flex;flex-direction:column;gap:5px;
}
.ch .nm{text-align:center;font-weight:800;font-size:12px;letter-spacing:.06em}
.ch .gval{text-align:center;font:11px ui-monospace,monospace;color:#93c5fd}
.ch .btns{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.ch .btns button{padding:6px 2px;font-size:10px;font-weight:700;min-height:32px;border-radius:7px}
.ch .btns button.wide{grid-column:1/-1}
.ch .mutebtn{width:100%;font-weight:800;letter-spacing:.08em;background:#1c2430}
.ch .mutebtn.on{background:#3f1a1a;border-color:#e87979;color:#fecaca}

/* matrix */
.mx-wrap{overflow-x:auto}
.mx{border-collapse:separate;border-spacing:5px;margin:0 auto}
.mx th{font-size:10px;color:var(--mu);font-weight:600}
.dot{
  width:30px;height:30px;padding:0;border-radius:9px;background:#12161c;
}
.dot:after{content:"";display:block;width:8px;height:8px;margin:auto;border-radius:50%;background:#334155}
.dot.on{background:#172554;border-color:#3b82f6}
.dot.on:after{background:#60a5fa;box-shadow:0 0 8px #3b82f6}

/* params */
.field{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #243041}
.field .l{font-weight:600;color:#cbd5e1;min-width:72px}
.nw{display:flex;align-items:center;gap:4px}
.nw button{width:36px;min-width:36px;height:36px;padding:0;font-size:18px;font-weight:700}
#cv{width:100%;height:200px;display:block;background:#0a0c10;border-radius:10px;border:1px solid var(--bd);touch-action:none}
.eqb{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}
.eqb button{padding:8px 2px;font-size:11px;font-weight:700}
.eqb button.active{background:#1e3a5f;border-color:#fbbf24;color:#fff}
.rta-row{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:8px}
.rta-row span{font-size:10px;color:var(--mu)}

/* VU horizontal LED */
.vu-block{margin-bottom:12px}
.vu-block h4{margin:0 0 8px;font-size:10px;letter-spacing:.1em;color:var(--mu);text-transform:uppercase}
.vrow{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;margin-bottom:5px}
.vrow.lim{margin-bottom:4px}
.vlab{font-size:10px;font-weight:700;text-align:right;color:#94a3b8}
.vlab.lim{color:#f87171}
.vtr{
  position:relative;height:18px;border-radius:6px;
  background:#0a0c10;border:1px solid #1f2937;overflow:hidden;
  display:flex;flex-direction:row;gap:2px;padding:3px;
}
.vrow.lim .vtr{height:12px;padding:2px;background:#140c0e;border-color:#3f1d1d}
.vu-seg{flex:1 1 0;min-width:0;height:100%;border-radius:2px;background:#1f2937;opacity:.4;transition:opacity .05s linear,background .05s linear}
.vu-seg.on.g{background:#22c55e;opacity:1;box-shadow:0 0 4px rgba(34,197,94,.4)}
.vu-seg.on.y{background:#eab308;opacity:1}
.vu-seg.on.r{background:#ef4444;opacity:1;box-shadow:0 0 5px rgba(239,68,68,.45)}
.vscale{display:flex;justify-content:space-between;padding:2px 0 8px 52px;font:9px ui-monospace,monospace;color:#64748b;user-select:none}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:#334155;margin-left:3px;vertical-align:middle}
.led.on{background:#ef4444;box-shadow:0 0 8px #ef4444}

@media(max-width:899px){
  .tab-pane{display:none}
  .tab-pane.on{display:block}
}
@media(min-width:900px){
  .nav{display:none}
  .tab-pane{display:block!important}
  .strips{flex-wrap:wrap;overflow:visible}
  .ch{flex:1 1 120px;max-width:140px}
  #cv{height:230px}
  .vtr{height:20px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><i>DS</i><div>dlms wansPRo<small>4 IN 8 OUT DSP</small></div></div>
    <div class="r">
      <span class="chip" id="st">SIAP</span>
      <button class="a" id="bs">Save</button>
    </div>
  </div>

  <div class="player">
    <button class="a" id="btnLoad">Load</button>
    <button id="btnPlay" disabled>Play</button>
    <button id="btnStop" disabled>Stop</button>
    <span class="info" id="trackInfo">Belum ada lagu</span>
    <label style="font-size:11px;color:var(--mu)">Vol <input type="range" id="vol" min="0" max="1" step="0.01" value="0.7"></label>
    <button class="a" id="ua">Unmute</button>
    <button id="ma">Mute All</button>
  </div>

  <nav class="nav" id="navMain">
    <button type="button" class="a" data-tab="in">INPUT</button>
    <button type="button" data-tab="route">ROUTE</button>
    <button type="button" data-tab="out">OUTPUT</button>
    <button type="button" data-tab="param">PARAM</button>
    <button type="button" data-tab="vu">SIG</button>
  </nav>

  <div class="pad">
    <div class="card tab-pane on" data-pane="in">
      <h2><b>Input</b> IN 1–4</h2>
      <div class="strips" id="I"></div>
    </div>
    <div class="card tab-pane" data-pane="route">
      <h2><b>Routing</b> 4×8 matrix</h2>
      <div class="mx-wrap"><table class="mx" id="X"></table></div>
    </div>
    <div class="card tab-pane" data-pane="out">
      <h2><b>Output</b> OUT 1–8</h2>
      <div class="strips" id="O"></div>
    </div>
    <div class="card tab-pane" data-pane="param" id="P">
      <h2><b>Parameter</b></h2>
      <div style="color:var(--mu)">Pilih GAIN / EQ / COMP / XOVER / LIM / DLY pada channel</div>
    </div>
    <div class="card tab-pane" data-pane="vu">
      <h2><b>VU Meters</b> </h2>
      <div id="MI"></div>
      <div id="MO"></div>
    </div>
  </div>
</div>
<input type="file" id="fi" accept="audio/*">
<script>

const $=s=>document.querySelector(s);
const cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const dbLin=db=>Math.pow(10,(db||0)/20);
const dBtxt=v=>v<=-90?'-∞':v.toFixed(1);

const EQN=6, EQF=[80,250,800,2500,6000,12000];
const BC=['#ff4b55','#ffc233','#3ddc84','#37d4e6','#4c8dff','#d36bff'];
function mkEq(){return EQF.map((f,i)=>({on:false,f,g:0,q:1.2,t:i===0?'lowshelf':i===EQN-1?'highshelf':'peaking'}));}
function mkComp(){return {on:false,th:-12,ratio:4,atk:10,rel:100};}
function mkIn(){return {mute:false,pol:false,gain:0,delay:0,eq:mkEq(),comp:mkComp()};}
function mkOut(){return {mute:false,pol:false,gain:0,delay:0,eq:mkEq(),comp:mkComp(),
  hpf:{on:false,f:80,slope:24},lpf:{on:false,f:8000,slope:24},
  lim:{on:true,th:-3,atk:3,rel:80}};}

let S, sel=null, band=0, drag=null;
try{
  const j=JSON.parse(localStorage.getItem('dlms_compact')||'null');
  S=j&&j.inputs?j:{inputs:[0,1,2,3].map(mkIn),outputs:[0,1,2,3,4,5,6,7].map(mkOut),routes:Array.from({length:4},()=>Array(8).fill(true))};
}catch(_){S={inputs:[0,1,2,3].map(mkIn),outputs:[0,1,2,3,4,5,6,7].map(mkOut),routes:Array.from({length:4},()=>Array(8).fill(true))};}

let actx, buf, src, master, playing=false, t0=0, off=0;
const iG=[],iPol=[],iDly=[],iEq=[],iComp=[],iDest=[],iAn=[];
const oSum=[],oHp=[],oLp=[],oEq=[],oDly=[],oPol=[],oG=[],oComp=[],oLim=[],oAn=[];

// Accurate LED thresholds (dBFS) matching classic pro meter
const VU_LEDS = [
  {db:-60,c:'g'},{db:-40,c:'g'},{db:-28,c:'g'},{db:-20,c:'g'},
  {db:-16,c:'g'},{db:-12,c:'g'},{db:-8,c:'g'},{db:-4,c:'g'},
  {db:-2,c:'y'},{db:0,c:'y'},{db:2,c:'y'},{db:4,c:'r'},{db:6,c:'r'},{db:8,c:'r'}
];
const VU_LABELS = ['-60','-40','-28','-20','-16','-12','-8','-4','-2','0','+2','+4','+6','+8'];
const mIn=Array(4).fill(-90), mOut=Array(8).fill(-90), mGr=Array(8).fill(0);
const RTA_N=96;
let rtaRaw=Array(RTA_N).fill(-100), rtaDisp=Array(RTA_N).fill(-100);
let rtaView={k:'o',i:0};
const elc={};

function el(id){return elc[id]||(elc[id]=document.getElementById(id));}
function peakDb(a){
  if(!a) return -90;
  if(!peakDb.b||peakDb.b.length!==a.fftSize) peakDb.b=new Float32Array(a.fftSize);
  a.getFloatTimeDomainData(peakDb.b);
  let p=0; const d=peakDb.b;
  for(let i=0;i<d.length;i+=8){const v=d[i]<0?-d[i]:d[i]; if(v>p)p=v;}
  return p<1e-5?-90:20*Math.log10(p);
}

function mkLedMeter(id, lim){
  const segs = VU_LEDS.map((s,i)=>`<div class="vu-seg ${lim?'r':s.c}" data-i="${i}"></div>`).join('');
  return `<div class="vtr${lim?' lim':''}" id="${id}">${segs}</div>`;
}
function mkScale(lim){
  return `<div class="vscale${lim?' lim':''}">${VU_LABELS.map(t=>`<span>${t}</span>`).join('')}</div>`;
}
// smooth display levels per meter id
const vuSmooth = {};
function setLedMeter(id, db){
  const root = el(id);
  if(!root) return;
  // smooth ballistics: fast up, medium down
  let cur = vuSmooth[id];
  if(cur === undefined) cur = -90;
  // naik sangat halus-cepat, turun lembut (pro meter feel)
  cur = db > cur ? cur + (db - cur) * 0.55 : cur + (db - cur) * 0.14;
  vuSmooth[id] = cur;
  const segs = root.children;
  for(let i=0;i<segs.length;i++){
    const th = VU_LEDS[i] ? VU_LEDS[i].db : -60;
    if(cur >= th - 0.2) segs[i].classList.add('on');
    else segs[i].classList.remove('on');
  }
}
function setLimMeter(id, gr){
  const db = -60 + (Math.max(0, gr)/12)*68;
  setLedMeter(id, db);
}
function setBar(id,db){ setLedMeter(id, db); }
function setLimBar(id,gr){ setLimMeter(id, gr); }


function ensure(){
  if(actx){if(actx.state==='suspended')actx.resume();return;}
  actx=new (AudioContext||webkitAudioContext)();
  master=actx.createGain(); master.gain.value=+$('#vol').value; master.connect(actx.destination);
  for(let i=0;i<4;i++){
    iG[i]=actx.createGain(); iPol[i]=actx.createGain(); iDly[i]=actx.createDelay(1);
    iComp[i]=actx.createDynamicsCompressor(); iDest[i]=actx.createGain(); iEq[i]=[];
    let p=iG[i]; p.connect(iPol[i]); p=iPol[i]; p.connect(iDly[i]); p=iDly[i];
    for(let b=0;b<EQN;b++){const f=actx.createBiquadFilter(); f.type='peaking'; p.connect(f); p=f; iEq[i][b]=f;}
    p.connect(iComp[i]); iComp[i].connect(iDest[i]);
    iAn[i]=actx.createAnalyser(); iAn[i].fftSize=2048; iAn[i].smoothingTimeConstant=.4;
    iDest[i].connect(iAn[i]);
  }
  for(let o=0;o<8;o++){
    oSum[o]=actx.createGain();
    oHp[o]=actx.createBiquadFilter(); oHp[o].type='highpass'; oHp[o].frequency.value=20;
    oLp[o]=actx.createBiquadFilter(); oLp[o].type='lowpass'; oLp[o].frequency.value=20000;
    oEq[o]=[]; oDly[o]=actx.createDelay(1); oPol[o]=actx.createGain(); oG[o]=actx.createGain();
    oComp[o]=actx.createDynamicsCompressor(); oLim[o]=actx.createDynamicsCompressor();
    oAn[o]=actx.createAnalyser(); oAn[o].fftSize=2048; oAn[o].smoothingTimeConstant=.4;
    let p=oSum[o]; p.connect(oHp[o]); p=oHp[o]; p.connect(oLp[o]); p=oLp[o];
    for(let b=0;b<EQN;b++){const f=actx.createBiquadFilter(); f.type='peaking'; p.connect(f); p=f; oEq[o][b]=f;}
    p.connect(oDly[o]); oDly[o].connect(oPol[o]); oPol[o].connect(oG[o]);
    oG[o].connect(oComp[o]); oComp[o].connect(oLim[o]); oLim[o].connect(oAn[o]); oAn[o].connect(master);
  }
  applyAll(); route();
}
function route(){
  if(!actx)return;
  for(let i=0;i<4;i++){try{iDest[i].disconnect();}catch(_){} iDest[i].connect(iAn[i]);}
  for(let i=0;i<4;i++) for(let o=0;o<8;o++) if(S.routes[i][o]) iDest[i].connect(oSum[o]);
}
function setComp(n,c,lim){
  const t=actx.currentTime, on=!!c.on;
  if(lim){
    n.threshold.setTargetAtTime(on?(c.th??-3):0,t,.01);
    n.ratio.setTargetAtTime(on?20:1,t,.01); n.knee.setTargetAtTime(on?2:0,t,.01);
    n.attack.setTargetAtTime(on?Math.max(.001,(c.atk??3)/1000):.003,t,.01);
    n.release.setTargetAtTime(on?Math.max(.02,(c.rel??80)/1000):.1,t,.01);
  }else{
    n.threshold.setTargetAtTime(on?(c.th??-12):0,t,.01);
    n.ratio.setTargetAtTime(on?(c.ratio??4):1,t,.01); n.knee.setTargetAtTime(on?6:0,t,.01);
    n.attack.setTargetAtTime(on?Math.max(.001,(c.atk??10)/1000):.01,t,.01);
    n.release.setTargetAtTime(on?Math.max(.02,(c.rel??100)/1000):.15,t,.01);
  }
}
function applyIn(i){
  if(!actx)return; const ch=S.inputs[i], t=actx.currentTime;
  iG[i].gain.setTargetAtTime(ch.mute?0:dbLin(cl(ch.gain,-18,18)),t,.01);
  iPol[i].gain.setTargetAtTime(ch.pol?-1:1,t,.01);
  iDly[i].delayTime.setTargetAtTime(cl((ch.delay||0)/1000,0,1),t,.02);
  for(let b=0;b<EQN;b++){
    const e=ch.eq[b], n=iEq[i][b];
    n.type=e.t||'peaking'; n.frequency.setTargetAtTime(e.f,t,.01);
    n.Q.setTargetAtTime(e.q||1,t,.01); n.gain.setTargetAtTime(e.on?(e.g||0):0,t,.01);
  }
  setComp(iComp[i], ch.comp||mkComp(), false);
}
function applyOut(o){
  if(!actx)return; const ch=S.outputs[o], t=actx.currentTime;
  oG[o].gain.setTargetAtTime(ch.mute?0:dbLin(cl(ch.gain,-18,18)),t,.01);
  oPol[o].gain.setTargetAtTime(ch.pol?-1:1,t,.01);
  oDly[o].delayTime.setTargetAtTime(cl((ch.delay||0)/1000,0,1),t,.02);
  oHp[o].frequency.setTargetAtTime(ch.hpf.on?cl(ch.hpf.f,20,10000):20,t,.01);
  oHp[o].Q.setTargetAtTime(ch.hpf.slope>=24?0.707:0.5,t,.01);
  oLp[o].frequency.setTargetAtTime(ch.lpf.on?cl(ch.lpf.f,50,20000):20000,t,.01);
  oLp[o].Q.setTargetAtTime(ch.lpf.slope>=24?0.707:0.5,t,.01);
  for(let b=0;b<EQN;b++){
    const e=ch.eq[b], n=oEq[o][b];
    n.type=e.t||'peaking'; n.frequency.setTargetAtTime(e.f,t,.01);
    n.Q.setTargetAtTime(e.q||1,t,.01); n.gain.setTargetAtTime(e.on?(e.g||0):0,t,.01);
  }
  setComp(oComp[o], ch.comp||mkComp(), false);
  setComp(oLim[o], {on:ch.lim.on, th:ch.lim.th, atk:ch.lim.atk, rel:ch.lim.rel}, true);
}
function applyAll(){for(let i=0;i<4;i++)applyIn(i);for(let o=0;o<8;o++)applyOut(o);}

function btn(k,i,p,lab,cls=''){return `<button class="${cls} ${sel&&sel.k===k&&sel.i===i&&sel.p===p?'sel':''}" data-k="${k}" data-i="${i}" data-p="${p}">${lab}</button>`;}

function draw(){
  $('#I').innerHTML=S.inputs.map((c,i)=>`<div class="ch">
    <div class="nm">IN ${i+1}</div>
    <div class="gval">${(+c.gain||0).toFixed(1)} dB</div>
    <button class="mutebtn ${c.mute?'on':''}" data-k="i" data-i="${i}" data-p="mute">MUTE</button>
    <div class="btns">
      <button class="${sel&&sel.k==='i'&&sel.i===i&&sel.p==='gain'?'sel':''}" data-k="i" data-i="${i}" data-p="gain">GAIN</button>
      <button class="${sel&&sel.k==='i'&&sel.i===i&&sel.p==='eq'?'sel':''}" data-k="i" data-i="${i}" data-p="eq">EQ</button>
      <button class="${sel&&sel.k==='i'&&sel.i===i&&sel.p==='comp'?'sel':''}" data-k="i" data-i="${i}" data-p="comp">COMP<span class="led" id="LCI${i}"></span></button>
      <button class="${sel&&sel.k==='i'&&sel.i===i&&sel.p==='dly'?'sel':''}" data-k="i" data-i="${i}" data-p="dly">DLY</button>
      <button class="wide ${c.pol?'on':''}" data-k="i" data-i="${i}" data-p="pol">Ø PHASE</button>
    </div>

function drawEq(){
  const cv=$('#cv'); if(!cv||!sel||sel.p!=='eq')return;
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth||320, h=210;
  if(cv.width!==((w*dpr)|0) || cv.height!==((h*dpr)|0)){ cv.width=(w*dpr)|0; cv.height=(h*dpr)|0; }
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const ch=sel.k==='i'?S.inputs[sel.i]:S.outputs[sel.i];
  const PL=30,PR=8,PT=10,PB=18, LMIN=Math.log10(20), SPAN=3, DR=15;
  const X=f=>PL+(Math.log10(cl(f,20,20000))-LMIN)/SPAN*(w-PL-PR);
  const Y=db=>PT+(h-PT-PB)*(0.5-db/(2*DR));
  // RTA scale -90..0
  const RY=db=>PT+(h-PT-PB)*(1-(Math.min(0,Math.max(-90,db))+90)/90);

  g.fillStyle='#0a0b0d'; g.fillRect(0,0,w,h);
  g.strokeStyle='#1f2328'; g.font='10px sans-serif'; g.fillStyle='#7d848d';
  for(let db=-DR;db<=DR;db+=5){
    const y=Y(db)|0; g.beginPath(); g.moveTo(PL,y); g.lineTo(w-PR,y); g.stroke();
    g.textAlign='right'; g.fillText((db>0?'+':'')+db,PL-4,y+3);
  }
  [20,50,100,200,500,1000,2000,5000,10000,20000].forEach(f=>{
    const x=X(f)|0; g.beginPath(); g.moveTo(x,PT); g.lineTo(x,h-PB); g.stroke();
    g.textAlign='center'; g.fillText(f>=1000?(f/1000)+'k':f,x,h-4);
  });

  // —— RTA Midas-style (kuning kontinu, per channel) ——
  const N=rtaDisp.length;
  const step=1;
  const nPts=Math.ceil((w-PL-PR)/step)+1;
  const vals=new Array(nPts);
  for(let k=0;k<nPts;k++){
    const x=PL+k*step;
    const f=Math.pow(10, LMIN + cl((x-PL)/(w-PL-PR),0,1)*SPAN);
    const idx=(Math.log10(cl(f,20,20000))-LMIN)/SPAN*(N-1);
    const i0=Math.max(0,Math.min(N-2,Math.floor(idx)));
    const t=idx-i0;
    vals[k]=rtaDisp[i0]*(1-t)+rtaDisp[i0+1]*t;
  }
  let a=vals.slice(), b=new Array(nPts);
  for(let pass=0;pass<2;pass++){
    for(let k=0;k<nPts;k++){
      const x0=a[Math.max(0,k-1)], x1=a[k], x2=a[Math.min(nPts-1,k+1)];
      b[k]=(x0+2*x1+x2)/4;
    }
    const tmp=a; a=b; b=tmp;
  }
  g.save();
  g.beginPath(); g.rect(PL,PT,w-PL-PR,h-PT-PB); g.clip();
  g.beginPath();
  g.moveTo(PL, RY(a[0]));
  for(let k=0;k<nPts-1;k++){
    const x0=PL+k*step, x1=PL+(k+1)*step;
    g.quadraticCurveTo(x0, RY(a[k]), (x0+x1)/2, (RY(a[k])+RY(a[k+1]))/2);
  }
  g.lineTo(PL+(nPts-1)*step, h-PB); g.lineTo(PL, h-PB); g.closePath();
  const grd=g.createLinearGradient(0,PT,0,h-PB);
  grd.addColorStop(0,'rgba(234,179,8,.42)');
  grd.addColorStop(0.55,'rgba(234,179,8,.16)');
  grd.addColorStop(1,'rgba(234,179,8,.03)');
  g.fillStyle=grd; g.fill();
  g.beginPath();
  g.moveTo(PL, RY(a[0]));
  for(let k=0;k<nPts-1;k++){
    const x0=PL+k*step, x1=PL+(k+1)*step;
    g.quadraticCurveTo(x0, RY(a[k]), (x0+x1)/2, (RY(a[k])+RY(a[k+1]))/2);
  }
  g.strokeStyle='#e4c15a'; g.lineWidth=1.4; g.lineJoin='round'; g.stroke();
  g.restore();

  // EQ response curve
  if(!drawEq.nodes){ensure(); drawEq.nodes=Array.from({length:EQN},()=>actx.createBiquadFilter());}
  const NP=120, fr=new Float32Array(NP), mg=new Float32Array(NP), ph=new Float32Array(NP), tot=new Float32Array(NP);
  for(let i=0;i<NP;i++) fr[i]=Math.pow(10,LMIN+SPAN*i/(NP-1));
  ch.eq.forEach((b,i)=>{
    const n=drawEq.nodes[i]; n.type=b.t||'peaking'; n.frequency.value=b.f; n.Q.value=b.q||1; n.gain.value=b.on?b.g:0;
    n.getFrequencyResponse(fr,mg,ph);
    for(let k=0;k<NP;k++) tot[k]+=20*Math.log10(Math.max(mg[k],1e-6));
  });
  g.beginPath();
  for(let i=0;i<NP;i++){const x=X(fr[i]), y=Y(cl(tot[i],-DR,DR)); i?g.lineTo(x,y):g.moveTo(x,y);}
  g.strokeStyle='#f4f4f4'; g.lineWidth=2; g.stroke();
  ch.eq.forEach((b,i)=>{
    const x=X(b.f), y=Y(b.on?b.g:0);
    g.beginPath(); g.arc(x,y,i===band?10:7,0,6.3);
    g.fillStyle=BC[i]; g.fill();
    g.strokeStyle=i===band?'#fff':'#0a0c10'; g.lineWidth=i===band?2:1.2; g.stroke();
    g.fillStyle='#0a0c10'; g.font='bold 9px system-ui,sans-serif'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(String(i+1),x,y);
  });
}

function bindCv(){
  const cv=$('#cv'); if(!cv)return;
  let pinch0=0, q0=1;
  const pinchDist=e=>{
    if(!e.touches||e.touches.length<2) return 0;
    const a=e.touches[0], b=e.touches[1];
    return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
  };
  const hit=e=>{
    const r=cv.getBoundingClientRect();
    const src=e.touches?e.touches[0]:e;
    const x=src.clientX-r.left, y=src.clientY-r.top;
    const w=r.width,h=r.height, PL=30,PR=8,PT=10,PB=18,DR=15,LMIN=Math.log10(20),SPAN=3;
    const X=f=>PL+(Math.log10(cl(f,20,20000))-LMIN)/SPAN*(w-PL-PR);
    const Y=db=>PT+(h-PT-PB)*(0.5-db/(2*DR));
    const ch=sel.k==='i'?S.inputs[sel.i]:S.outputs[sel.i];
    let best=null,bd=24;
    ch.eq.forEach((b,i)=>{const d=Math.hypot(X(b.f)-x,Y(b.on?b.g:0)-y); if(d<bd){bd=d;best=i;}});
    return {best,x,y,w,h,PL,PR,PT,PB,DR,LMIN,SPAN};
  };
  // Q / bandwidth: pinch out = LEBAR (Q kecil), pinch in = SEMPIT (Q besar)
  const applyQScale=(scale)=>{
    if(!sel||sel.p!=='eq') return;
    const ch=sel.k==='i'?S.inputs[sel.i]:S.outputs[sel.i];
    const b=ch.eq[band];
    // scale>1 (spread fingers) -> wider bandwidth -> lower Q
    let q = q0 / scale;
    q = cl(Math.round(q*100)/100, 0.3, 10);
    b.q=q; b.on=true;
    if(sel.k==='i') applyIn(sel.i); else applyOut(sel.i);
    bandRow(); drawEq();
  };
  cv.onpointerdown=e=>{
    if(e.pointerType==='touch' && e.isPrimary===false) return;
    const h=hit(e); if(h.best==null)return;
    drag=h.best; band=h.best; bandRow(); drawEq();
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
  };
  cv.onpointermove=e=>{
    if(drag==null)return;
    const r=cv.getBoundingClientRect();
    const x=e.clientX-r.left, y=e.clientY-r.top;
    const w=r.width,hgt=r.height, PL=30,PR=8,PT=10,PB=18,DR=15,LMIN=Math.log10(20),SPAN=3;
    const FX=xx=>Math.pow(10,LMIN+cl((xx-PL)/(w-PL-PR),0,1)*SPAN);
    const GY=yy=>(0.5-(yy-PT)/(hgt-PT-PB))*2*DR;
    const ch=sel.k==='i'?S.inputs[sel.i]:S.outputs[sel.i];
    const b=ch.eq[drag];
    b.f=cl(FX(x),20,20000); b.g=cl(Math.round(GY(y)*10)/10,-15,15); b.on=true;
    if(sel.k==='i') applyIn(sel.i); else applyOut(sel.i);
    drawEq();
  };
  cv.onpointerup=()=>{drag=null;};
  cv.ontouchstart=e=>{
    if(e.touches&&e.touches.length===2){
      pinch0=pinchDist(e);
      const ch=sel.k==='i'?S.inputs[sel.i]:S.outputs[sel.i];
      q0=ch.eq[band].q||1.2;
      drag=null;
      e.preventDefault();
    }
  };
  cv.ontouchmove=e=>{
    if(e.touches&&e.touches.length===2&&pinch0>20){
      const d=pinchDist(e);
      applyQScale(d/pinch0);
      e.preventDefault();
    }
  };
  cv.ontouchend=()=>{pinch0=0;};
  // PC: ctrl+wheel or alt+wheel = bandwidth; plain wheel = Q fine
  cv.onwheel=e=>{
    if(!sel||sel.p!=='eq') return;
    e.preventDefault();
    const ch=sel.k==='i'?S.inputs[sel.i]:S.outputs[sel.i];
    const b=ch.eq[band];
    // scroll up = wider (Q down), scroll down = narrower (Q up)
    const factor = e.deltaY<0 ? 0.9 : 1.1;
    b.q=cl(Math.round(b.q*factor*100)/100, 0.3, 10);
    b.on=true;
    if(sel.k==='i') applyIn(sel.i); else applyOut(sel.i);
    bandRow(); drawEq();
  };
}


function setPath(path,val){
  const parts=path.split('.');
  let o=S;
  for(let i=0;i<parts.length-1;i++){
    if(o[parts[i]]==null) o[parts[i]]={};
    o=o[parts[i]];
  }
  const last=parts[parts.length-1];
  o[last]=val;
  const sec=parts[0]==='inputs'?'i':'o';
  const idx=+parts[1];
  if(sec==='i') applyIn(idx); else applyOut(idx);
  if(sel&&sel.p==='eq') drawEq();
}

function fillRta(analyser){
  const N=RTA_N;
  if(!analyser||!actx){
    for(let i=0;i<N;i++){ rtaRaw[i]=-100; rtaDisp[i]=-100; }
    return;
  }
  const fftN=analyser.frequencyBinCount;
  if(!fillRta._b||fillRta._b.length!==fftN) fillRta._b=new Float32Array(fftN);
  const bins=fillRta._b;
  analyser.getFloatFrequencyData(bins);
  const nyq=(actx.sampleRate||48000)/2;
  for(let i=0;i<N;i++){
    const freq=20*Math.pow(10,3*i/(N-1));
    const f0=freq/Math.pow(2,1/24), f1=freq*Math.pow(2,1/24);
    const b0=Math.max(0,Math.floor(f0/nyq*fftN));
    const b1=Math.max(b0+1,Math.min(fftN-1,Math.ceil(f1/nyq*fftN)));
    let acc=0,c=0;
    for(let k=b0;k<=b1;k++){ let v=bins[k]; if(!(v>-140)) v=-140; acc+=Math.pow(10,v/10); c++; }
    let v=10*Math.log10(Math.max(acc/Math.max(c,1),1e-14));
    const cur=rtaRaw[i];
    rtaRaw[i]=cur+(v-cur)*(v>cur?0.55:0.18);
  }
  // light spatial smooth
  for(let i=0;i<N;i++){
    let s=0,w=0;
    for(let k=-2;k<=2;k++){
      const j=i+k; if(j<0||j>=N) continue;
      const ww=3-Math.abs(k); s+=rtaRaw[j]*ww; w+=ww;
    }
    rtaDisp[i]=s/w;
  }
}

let fr=0;
function tick(){
  fr++;
  if(playing&&actx){
    for(let i=0;i<4;i++){
      let db=peakDb(iAn[i]); if(S.inputs[i].mute) db=-90;
      mIn[i]=db;
      setBar('VI'+i,db);
    }
    for(let o=0;o<8;o++){
      let db=peakDb(oAn[o]); if(S.outputs[o].mute) db=-90;
      mOut[o]=db;
      let gr=0; if(S.outputs[o].lim?.on&&oLim[o]) gr=Math.min(12,Math.max(0,-(oLim[o].reduction||0)));
      mGr[o]=gr;
      setBar('VO'+o,db); setLimBar('VL'+o,gr);
    }
    // RTA per channel (sumber = tombol RTA / channel EQ aktif)
    {
      const an = rtaView.k==='i' ? iAn[rtaView.i] : oAn[rtaView.i];
      fillRta(an);
    }
  } else if((fr&3)===0){
    // idle soft spectrum
    const t=Date.now()/1000;
    for(let i=0;i<RTA_N;i++){
      const t01=i/(RTA_N-1);
      const shape=Math.exp(-Math.pow((t01-0.28)/0.38,2));
      const base=Math.max(...mOut,...mIn,-90);
      const target=Math.max(-90, Math.min(-8, -52+(base+60)*0.3+shape*14*(0.85+0.15*Math.sin(t*1.2+i*0.1))));
      rtaRaw[i]+=(target-rtaRaw[i])*0.1;
    }
    for(let i=0;i<RTA_N;i++){
      let s=0,w=0;
      for(let k=-2;k<=2;k++){ const j=i+k; if(j>=0&&j<RTA_N){ const ww=3-Math.abs(k); s+=rtaRaw[j]*ww; w+=ww; } }
      rtaDisp[i]=s/w;
    }
  }
  // LED COMP
  if(actx&&(fr&3)===0){
    for(let i=0;i<4;i++){
      const on=S.inputs[i].comp?.on, gr=on&&iComp[i]?Math.max(0,-(iComp[i].reduction||0)):0;
      const e=el('LCI'+i); if(e) e.classList.toggle('on',gr>0.3);
    }
    for(let o=0;o<8;o++){
      const on=S.outputs[o].comp?.on, gr=on&&oComp[o]?Math.max(0,-(oComp[o].reduction||0)):0;
      const e=el('LCO'+o); if(e) e.classList.toggle('on',gr>0.3);
    }
    if(sel?.p==='comp'){
      const ch=sel.k==='i'?S.inputs[sel.i]:S.outputs[sel.i];
      const node=sel.k==='i'?iComp[sel.i]:oComp[sel.i];
      const gr=ch.comp?.on&&node?Math.max(0,-(node.reduction||0)):0;
      const e=el('LCP'); if(e) e.classList.toggle('on',gr>0.3);
      const g=el('CGR'); if(g) g.textContent=gr>0.05?('−'+gr.toFixed(1)+' dB'):'0.0 dB';
    }
  }
  if(sel?.p==='eq'&&(fr%2)===0) drawEq();
  requestAnimationFrame(tick);
}

$('#btnLoad').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{
  const f=e.target.files[0]; if(!f)return; ensure();
  try{
    buf=await actx.decodeAudioData(await f.arrayBuffer());
    $('#trackInfo').textContent=f.name;
    $('#btnPlay').disabled=false; $('#btnStop').disabled=false;
    stop(); $('#st').textContent='Lagu OK';
  }catch(err){$('#st').textContent='Gagal decode';}
};
function stop(){
  if(src){try{src.stop();}catch(_){} try{src.disconnect();}catch(_){} src=null;}
  playing=false; off=0; $('#btnPlay').textContent='Play';
}
function play(){
  if(!buf)return; ensure(); applyAll(); route();
  if(src){try{src.stop();}catch(_){} try{src.disconnect();}catch(_){}}
  src=actx.createBufferSource(); src.buffer=buf; src.loop=true;
  for(let i=0;i<4;i++) src.connect(iG[i]);
  src.start(0, off%buf.duration); t0=actx.currentTime-off; playing=true;
  $('#btnPlay').textContent='Pause';
}
$('#btnPlay').onclick=()=>{ if(playing){off=actx.currentTime-t0; if(src){try{src.stop();}catch(_){} src=null;} playing=false; $('#btnPlay').textContent='Play';} else play(); };
$('#btnStop').onclick=stop;
$('#vol').oninput=()=>{if(master) master.gain.value=+$('#vol').value;};
$('#bs').onclick=()=>{localStorage.setItem('dlms_compact',JSON.stringify(S)); $('#st').textContent='TERSIMPAN'; $('#st').classList.add('ok');};
$('#ma').onclick=()=>{S.outputs.forEach((c,o)=>{c.mute=true; applyOut(o);}); draw();};
$('#ua').onclick=()=>{S.outputs.forEach((c,o)=>{c.mute=false; applyOut(o);}); draw();};


// Tab nav (HP); laptop shows all
function showTab(name){
  document.querySelectorAll('.tab-pane').forEach(p=>{
    p.classList.toggle('on', p.dataset.pane===name);
  });
  document.querySelectorAll('#navMain [data-tab]').forEach(b=>{
    b.classList.toggle('a', b.dataset.tab===name);
  });
  try{ localStorage.setItem('dlms_tab', name); }catch(_){}
}
document.getElementById('navMain')?.addEventListener('click', e=>{
  const b=e.target.closest('[data-tab]'); if(!b) return;
  showTab(b.dataset.tab);
});
// default tab
(function(){
  let t='in';
  try{ t=localStorage.getItem('dlms_tab')||'in'; }catch(_){}
  showTab(t);
})();
// When opening parameter from channel, jump to PARAM tab on HP
const _panel = panel;
panel = function(){
  _panel();
  if(window.matchMedia('(max-width:899px)').matches) showTab('param');
};

draw(); tick();
